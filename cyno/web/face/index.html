<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyno Bot — Face Display</title>
  <link rel="stylesheet" href="/shared/theme.css?v=1" />
  <style>
    /* Colours come from /shared/theme.css (also used by the chest screen); set on body so
       the Blue theme class reaches them. */
    body {
      --primary: var(--cy-accent);
      --primary-glow: rgba(var(--cy-accent-rgb), 0.75);
      --primary-border: rgba(var(--cy-accent-rgb), 0.82);
      --primary-border-soft: rgba(var(--cy-accent-rgb), 0.32);
      --visor-c1: var(--cy-bg1);
      --visor-c2: var(--cy-bg2);
      --visor-c3: var(--cy-bg3);
      --pill-bg: rgba(var(--cy-panel-rgb), 0.85);
      --text: var(--cy-text);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #000000;
      color: var(--text);
      font-family: var(--cy-font);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body.cursor-idle {
      cursor: none;
    }

    /* Robot Face Visor Container */
    .face-visor {
      position: fixed;
      /* Each side is adjustable from Cyno Control (Controls > Face alignment) to fit the head opening. */
      top: var(--frame-top, 16px);
      right: var(--frame-right, 16px);
      bottom: var(--frame-bottom, 16px);
      left: var(--frame-left, 16px);
      background: radial-gradient(ellipse at center, var(--visor-c1) 0%, var(--visor-c2) 70%, var(--visor-c3) 100%);
      border: 3.5px solid var(--primary-border);
      border-radius: var(--frame-radius, 36px);
      box-shadow:
        0 0 20px var(--primary-glow),
        0 0 48px var(--primary-border-soft),
        inset 0 0 30px var(--primary-border-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: visorGlowPulse 4s infinite ease-in-out;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    @keyframes visorGlowPulse {
      0%, 100% {
        opacity: 0.94;
      }
      50% {
        opacity: 1;
      }
    }

    .eyes-row {
      display: flex;
      gap: clamp(130px, 16vw, 175px);
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
      margin-bottom: 20px;
    }

    .eye-ring {
      width: clamp(170px, 34vmin, 220px);
      height: clamp(170px, 34vmin, 220px);
      border-radius: 50%;
      border: clamp(16px, 3vmin, 20px) solid var(--primary);
      box-shadow: 0 0 45px var(--primary-glow), inset 0 0 30px var(--primary-glow);
      position: relative;
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pupil {
      width: clamp(44px, 8vmin, 56px);
      height: clamp(44px, 8vmin, 56px);
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 20px #ffffff, 0 0 36px var(--primary);
      transition: transform 0.12s ease-out, opacity 0.15s ease, box-shadow 0.25s ease;
    }

    /* Blink state */
    .eye-ring.blink {
      height: 18px;
      border-width: 9px;
      border-radius: 14px;
    }
    .eye-ring.blink .pupil {
      opacity: 0;
    }

    /* Happy / Greet state */
    .eye-ring.happy {
      border-bottom-color: transparent;
      border-left-color: transparent;
      border-right-color: transparent;
      border-top-width: 28px;
      transform: translateY(26px);
    }

    /* Thinking state */
    .eye-ring.thinking {
      animation: spinPulse 1.1s infinite ease-in-out;
      border-style: dashed;
    }
    @keyframes spinPulse {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    /* Mouth / Smile Curve */
    .mouth {
      margin-top: clamp(20px, 4.5vmin, 38px);
      width: clamp(100px, 18vmin, 130px);
      height: clamp(32px, 5.8vmin, 44px);
      border-bottom: 8px solid var(--primary);
      border-radius: 0 0 70px 70px;
      box-shadow: 0 8px 24px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .mouth.speaking {
      animation: talkWave 0.28s infinite alternate ease-in-out;
      border-radius: 30px;
      border: 7px solid var(--primary);
      height: 42px;
    }
    @keyframes talkWave {
      0% { transform: scaleY(0.45) scaleX(0.9); }
      100% { transform: scaleY(1.25) scaleX(1.15); }
    }

    /* Auto-hiding Corner Utility Bar */
    .corner-bar {
      position: fixed;
      top: 32px;
      right: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    body.cursor-idle .corner-bar {
      opacity: 0;
      pointer-events: none;
    }

    .pill-btn {
      appearance: none;
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--primary-border-soft);
      padding: 7px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--primary);
      color: #061018;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <!-- Auto-hiding utility actions (fades out when mouse is still) -->
  <div class="corner-bar">
    <button class="pill-btn" id="btnToggleTheme" onclick="toggleFaceTheme()">Color: Red</button>
    <button class="pill-btn" onclick="openControllerWindow()">Open Controls Window</button>
    <button class="pill-btn" onclick="toggleFullScreen()">Fullscreen</button>
  </div>

  <!-- Robot Face Visor Container -->
  <div class="face-visor" id="visor">
    <div class="eyes-row" id="eyesRow">
      <div class="eye-ring" id="leftEye"><div class="pupil" id="leftPupil"></div></div>
      <div class="eye-ring" id="rightEye"><div class="pupil" id="rightPupil"></div></div>
    </div>
    <div class="mouth" id="mouth"></div>
  </div>

  <script>
    const CHANNEL_NAME = 'cyno_bot_sync_v1';
    const STORAGE_KEY = 'cyno_bot_state_v1';
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL_NAME) : null;
    let controllerWin = null;

    const eyesRow = document.getElementById('eyesRow');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const leftPupil = document.getElementById('leftPupil');
    const rightPupil = document.getElementById('rightPupil');
    const mouth = document.getElementById('mouth');
    const btnToggleTheme = document.getElementById('btnToggleTheme');

    let currentState = {
      theme: 'RED',
      flow_step: 'IDLE',
      expression: 'IDLE',
      eye_x: 0.0,
      eye_y: 0.0,
      head_pan: 90,
      head_tilt: 90,
      arm_gesture_plan_b: 'IDLE',
      last_spoken_text: 'Welcome to the University! How can I help you today?'
    };

    let speakingTimeout = null;
    let idleCursorTimer = null;

    // Auto-hide corner buttons and cursor when mouse is inactive
    function resetCursorIdle() {
      document.body.classList.remove('cursor-idle');
      clearTimeout(idleCursorTimer);
      idleCursorTimer = setTimeout(() => {
        document.body.classList.add('cursor-idle');
      }, 2600);
    }
    window.addEventListener('mousemove', resetCursorIdle);
    window.addEventListener('mousedown', resetCursorIdle);
    resetCursorIdle();

    function openControllerWindow() {
      controllerWin = window.open('controls.html', 'CynoBotControls', 'width=860,height=680');
    }

    function toggleFaceTheme() {
      const nextTheme = currentState.theme === 'BLUE' ? 'RED' : 'BLUE';
      applyRobotState({ theme: nextTheme }, false);
      const payload = {
        type: 'CYNO_STATE_UPDATE',
        state: currentState,
        speak: false,
        action: null,
        ts: Date.now()
      };
      if (bc) bc.postMessage(payload);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
      if (controllerWin && !controllerWin.closed) {
        try { controllerWin.postMessage(payload, '*'); } catch (e) {}
      }
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(payload, '*'); } catch (e) {}
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      } else if (e.key === 'c' || e.key === 'C') {
        openControllerWindow();
      }
    });

    function triggerBlink() {
      leftEye.classList.add('blink');
      rightEye.classList.add('blink');
      setTimeout(() => {
        leftEye.classList.remove('blink');
        rightEye.classList.remove('blink');
      }, 220);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 1.02;
      utter.onstart = () => mouth.classList.add('speaking');
      utter.onend = () => {
        if (currentState.expression !== 'SPEAKING') {
          mouth.classList.remove('speaking');
        }
      };
      window.speechSynthesis.speak(utter);
    }

    // Glow-ring position, nudged per side from Cyno Control so it lines up with the head opening.
    function applyFaceFrame(f) {
      const root = document.documentElement.style;
      ['top', 'right', 'bottom', 'left', 'radius'].forEach((k) => {
        if (Number.isFinite(Number(f[k]))) root.setProperty('--frame-' + k, Number(f[k]) + 'px');
      });
    }

    // sticky: the backend drives SPEAKING on/off itself, so skip the 3.8s auto-stop
    function applyRobotState(state, shouldSpeak = false, action = null, sticky = false) {
      if (action === 'BLINK') {
        triggerBlink();
        return;
      }
      if (action === 'STOP_SPEECH' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      currentState = { ...currentState, ...state };

      if (state.face_frame) applyFaceFrame(state.face_frame);

      const isBlue = currentState.theme === 'BLUE';
      document.body.classList.toggle('theme-blue', isBlue);
      if (btnToggleTheme) {
        btnToggleTheme.textContent = isBlue ? 'Color: Blue' : 'Color: Red';
      }

      // Responsive eye tracking movement
      const maxOffset = 42;
      const offsetX = (currentState.eye_x || 0) * maxOffset;
      const offsetY = (currentState.eye_y || 0) * (maxOffset * 0.45);

      eyesRow.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      leftPupil.style.transform = `translate(${offsetX * 0.5}px, ${offsetY * 0.5}px)`;
      rightPupil.style.transform = `translate(${offsetX * 0.5}px, ${offsetY * 0.5}px)`;

      // Expressions
      leftEye.classList.remove('happy', 'thinking');
      rightEye.classList.remove('happy', 'thinking');
      mouth.classList.remove('speaking');
      clearTimeout(speakingTimeout);

      const expr = currentState.expression;
      if (expr === 'GREET' || expr === 'HAPPY') {
        leftEye.classList.add('happy');
        rightEye.classList.add('happy');
      } else if (expr === 'THINKING') {
        leftEye.classList.add('thinking');
        rightEye.classList.add('thinking');
      } else if (expr === 'SPEAKING') {
        mouth.classList.add('speaking');
        if (!sticky) speakingTimeout = setTimeout(() => {
          mouth.classList.remove('speaking');
          if (currentState.expression === 'SPEAKING') {
            currentState.expression = 'IDLE';
          }
        }, 3800);
      }

      if (shouldSpeak && currentState.last_spoken_text) {
        speakText(currentState.last_spoken_text);
      }
    }

    // Listen to Controller Window via BroadcastChannel, postMessage, and localStorage
    function handleSyncPayload(payload) {
      if (!payload || payload.type !== 'CYNO_STATE_UPDATE') return;
      applyRobotState(payload.state || {}, Boolean(payload.speak), payload.action || null);
    }

    if (bc) {
      bc.onmessage = (ev) => handleSyncPayload(ev.data);
    }
    window.addEventListener('message', (ev) => handleSyncPayload(ev.data));
    window.addEventListener('storage', (ev) => {
      if (ev.key === STORAGE_KEY && ev.newValue) {
        try { handleSyncPayload(JSON.parse(ev.newValue)); } catch (e) {}
      }
    });

    // Load last saved state if available
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.state) {
          applyRobotState(parsed.state, false);
        }
      }
    } catch (e) {}

    // Natural eye blinking every 3.8 seconds
    setInterval(triggerBlink, 3800);

    // Optional Backend WebSocket Sync
    function connectWS() {
      if (location.protocol === 'file:' || !location.host) return;
      try {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.state) {
              applyRobotState(msg.state, Boolean(msg.speak), null, Boolean(msg.sticky));
            }
          } catch (err) {}
        };
        ws.onclose = () => setTimeout(connectWS, 3000);
      } catch (e) {}
    }
    connectWS();
  </script>
</body>
</html>
