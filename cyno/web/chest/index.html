<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyno Bot — Chest Display</title>
  <style>
    :root {
      --primary: #ff2a3c;
      --primary-glow: rgba(255, 42, 60, 0.55);
      --primary-soft: rgba(255, 42, 60, 0.28);
      --bg: #0b0405;
      --surface: rgba(28, 12, 14, 0.85);
      --text: #fcecef;
      --muted: #b08d95;
    }
    body.theme-blue {
      --primary: #00e5ff;
      --primary-glow: rgba(0, 229, 255, 0.55);
      --primary-soft: rgba(0, 229, 255, 0.28);
      --bg: #03070d;
      --surface: rgba(14, 22, 34, 0.85);
      --text: #eceef2;
      --muted: #8b9eb7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: radial-gradient(ellipse at top, #1a0a0d 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      width: 100vw; height: 100vh; overflow: hidden;
      user-select: none; -webkit-font-smoothing: antialiased;
    }
    body.theme-blue { background: radial-gradient(ellipse at top, #061427 0%, var(--bg) 70%); }

    .shell { height: 100%; display: flex; flex-direction: column; padding: 28px 36px; gap: 22px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.18em; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--primary-soft);
      font-size: 14px; color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
    .status.live .dot { background: var(--primary); box-shadow: 0 0 10px var(--primary-glow); animation: pulse 1.6s infinite; }
    .status.connecting .dot { background: #e0b341; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .mode { margin-right: 8px; font-size: 12px; letter-spacing: 0.06em; }

    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0; }

    .caption { font-size: clamp(24px, 4vw, 40px); font-weight: 600; line-height: 1.3; text-align: center; }
    .you { font-size: 18px; color: var(--muted); text-align: center; min-height: 1.4em; }

    .card {
      align-self: center; width: min(720px, 100%); background: var(--surface);
      border: 1.5px solid var(--primary-soft); border-radius: 22px; padding: 22px 26px;
      box-shadow: 0 0 30px var(--primary-soft); display: none;
    }
    .card.show { display: block; animation: rise 0.3s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    .card h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
    .card p { font-size: 19px; line-height: 1.45; }

    .start {
      align-self: center; appearance: none; cursor: pointer; font: inherit;
      font-size: 26px; font-weight: 700; color: var(--text);
      background: transparent; border: 3px solid var(--primary); border-radius: 999px;
      padding: 26px 56px; box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px var(--primary-soft);
    }
    .start:active { transform: scale(0.98); }
    .bottom { display: flex; justify-content: center; }
    .end {
      appearance: none; cursor: pointer; font: inherit; font-size: 15px; color: var(--muted);
      background: var(--surface); border: 1px solid var(--primary-soft); border-radius: 999px; padding: 10px 22px;
    }
    .hidden { display: none !important; }
    .error { color: #ffb4b4; text-align: center; font-size: 15px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand">CYNO BOT</span>
      <span>
        <span class="status mode hidden" id="mode"></span>
        <span class="status" id="status"><span class="dot"></span><span id="statusLabel">Offline</span></span>
      </span>
    </header>

    <main class="stage">
      <div class="caption" id="caption">Tap the screen to talk to Cyno.</div>
      <div class="you" id="you"></div>
      <div class="card" id="card"><h2 id="cardTitle"></h2><p id="cardBody"></p></div>
      <button class="start" id="btnStart">Tap to talk</button>
      <div class="error" id="error"></div>
    </main>

    <footer class="bottom">
      <button class="end hidden" id="btnEnd">End conversation</button>
    </footer>
  </div>
  <audio id="botAudio" autoplay></audio>

  <script>
    const $ = (id) => document.getElementById(id);
    let pc = null;
    let micStream = null;
    // True from "Tap to talk" until "End conversation": if the link drops in between
    // (e.g. Wi-Fi died), reconnect; the server then falls back to offline mode.
    let wantVoice = false;
    let sawLive = false;

    // ---- State bus (shared with the face display) ----
    function render(state) {
      document.body.classList.toggle('theme-blue', state.theme === 'BLUE');
      if (state.last_spoken_text) $('caption').textContent = state.last_spoken_text;
      $('you').textContent = state.user_text ? `You: “${state.user_text}”` : '';
      const card = state.card;
      $('card').classList.toggle('show', Boolean(card));
      if (card) { $('cardTitle').textContent = card.title; $('cardBody').textContent = card.body; }

      const st = state.voice_status || 'OFFLINE';
      // The server ended our live session (e.g. Gemini dropped): reconnect now rather
      // than waiting several seconds for WebRTC to notice the hang-up.
      if (st === 'LIVE') sawLive = true;
      if (st === 'OFFLINE' && sawLive && pc) { sawLive = false; dropped(pc); }
      $('status').className = 'status ' + st.toLowerCase();
      $('statusLabel').textContent = st === 'LIVE' ? 'Listening' : st === 'CONNECTING' ? 'Connecting…' : 'Offline';
      const live = st !== 'OFFLINE';
      $('btnStart').classList.toggle('hidden', live || wantVoice);
      $('btnEnd').classList.toggle('hidden', !live);
      $('mode').classList.toggle('hidden', !live || !state.voice_mode);
      $('mode').textContent = state.voice_mode === 'OFFLINE' ? 'OFFLINE MODE' : 'ONLINE';
    }

    function connectBus() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onmessage = (ev) => {
        try { const msg = JSON.parse(ev.data); if (msg.state) render(msg.state); } catch (e) {}
      };
      ws.onclose = () => setTimeout(connectBus, 2000);
    }
    connectBus();

    // ---- Voice link (WebRTC to the Pipecat pipeline) ----
    function waitForIce(peer, timeoutMs = 2500) {
      if (peer.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => { peer.removeEventListener('icegatheringstatechange', check); resolve(); };
        const check = () => { if (peer.iceGatheringState === 'complete') done(); };
        peer.addEventListener('icegatheringstatechange', check);
        setTimeout(done, timeoutMs);
      });
    }

    async function startVoice() {
      $('error').textContent = '';
      try {
        // Browser echo cancellation keeps Cyno from hearing its own voice.
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        pc = new RTCPeerConnection();
        // Pipecat expects transceiver 0 = audio, 1 = video (video stays unused).
        pc.addTransceiver(micStream.getAudioTracks()[0], { direction: 'sendrecv' });
        pc.addTransceiver('video', { direction: 'sendrecv' });
        pc.createDataChannel('chat');
        pc.ontrack = (ev) => {
          if (ev.track.kind === 'audio') $('botAudio').srcObject = ev.streams[0] || new MediaStream([ev.track]);
        };
        const thisPc = pc;
        pc.onconnectionstatechange = () => {
          if (['failed', 'closed', 'disconnected'].includes(thisPc.connectionState)) dropped(thisPc);
        };
        pc.oniceconnectionstatechange = () => {
          if (['failed', 'closed', 'disconnected'].includes(thisPc.iceConnectionState)) dropped(thisPc);
        };

        await pc.setLocalDescription(await pc.createOffer());
        await waitForIce(pc);
        const res = await fetch('/api/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
        });
        const answer = await res.json();
        if (!res.ok || answer.error) throw new Error(answer.error || `Server error ${res.status}`);
        await pc.setRemoteDescription(answer);
      } catch (err) {
        $('error').textContent = err.message || String(err);
        wantVoice = false;
        closeLink();
      }
    }

    function closeLink() {
      if (pc) { try { pc.close(); } catch (e) {} pc = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    }

    function dropped(which) {
      if (which !== pc) return;  // an old link we already replaced
      closeLink();
      if (wantVoice) setTimeout(() => { if (wantVoice && !pc) startVoice(); }, 500);
    }

    $('btnStart').addEventListener('click', () => { wantVoice = true; startVoice(); });
    $('btnEnd').addEventListener('click', () => { wantVoice = false; closeLink(); });
  </script>
</body>
</html>
